services:

  postgis:
    image: postgis/postgis:18-3.6-alpine
    container_name: postgis
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gis
    volumes:
      # The folder before the colon is on your computer: use the same postgres_data folder as Unit 5.
      # Windows: keep c:/gist415_data/postgres_data, or change it to your folder.
      # Mac example: /Users/yourname/gist415_data/postgres_data:/var/lib/postgresql
      # Never change the part after the colon.
      - c:/gist415_data/postgres_data:/var/lib/postgresql
    ports:
      - "25432:5432"
    networks:
      - gist415

  geoserver:
    image: kartoza/geoserver:2.23.0
    container_name: geoserver
    environment:
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_ADMIN_USER: admin
    volumes:
      # Windows: keep c:/gist415_data/geoserver_data, or change it to your folder.
      # Mac example: /Users/yourname/gist415_data/geoserver_data:/opt/geoserver/data_dir
      - c:/gist415_data/geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8280:8080"
    depends_on:
      - postgis
    networks:
      - gist415

# The gist415 network from Unit 5, shared with the Assignment 3 data loader.
# If Compose says it could not be found, run: docker network create gist415
networks:
  gist415:
    external: true
